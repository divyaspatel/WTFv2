<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What's New — WTF</title>
  <link rel="icon" type="image/svg+xml" href="/WTFv2/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream:  #F7F3EC;
      --cream2: #EDE6D9;
      --tc:     #C1440E;
      --tcL:    #F5EBE5;
      --sage:   #7A9268;
      --sageL:  #ECF1E8;
      --dark:   #2C2218;
      --mid:    #7A6E65;
      --lt:     #B0A69E;
      --bdr:    #E2D9CE;
      --wht:    #FFFFFF;
    }

    html, body {
      background: var(--cream);
      min-height: 100vh;
      font-family: 'DM Sans', -apple-system, sans-serif;
      color: var(--dark);
    }

    /* ── Page layout ── */
    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 24px 96px;
    }

    /* ── Header ── */
    .page-header {
      margin-bottom: 48px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--mid);
      text-decoration: none;
      margin-bottom: 32px;
      transition: color .15s ease;
    }
    .back-link:hover { color: var(--tc); }
    .back-link svg { flex-shrink: 0; }

    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }
    .wordmark-wtf {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 500;
      font-size: 22px;
      color: var(--tc);
      letter-spacing: -.01em;
      line-height: 1;
    }
    .wordmark-sub {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--lt);
      line-height: 1.3;
    }

    .page-hed {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 500;
      font-size: 28px;
      color: var(--dark);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .page-sub {
      font-size: 14px;
      font-weight: 300;
      color: var(--mid);
      line-height: 1.6;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--bdr);
      margin-bottom: 32px;
    }

    /* ── Entry list ── */
    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Entry card ── */
    .entry {
      background: var(--wht);
      border: 1px solid var(--bdr);
      border-radius: 18px;
      overflow: hidden;
      transition: border-color .15s ease;
    }
    .entry:hover { border-color: var(--lt); }

    /* ── Entry trigger (always visible) ── */
    .entry-trigger {
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }

    .entry-trigger-text {
      flex: 1;
      min-width: 0;
    }

    .entry-date {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 4px;
    }

    .entry-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 500;
      font-size: 17px;
      color: var(--dark);
      line-height: 1.3;
    }

    .entry-chevron {
      flex-shrink: 0;
      color: var(--lt);
      transition: transform .2s ease, color .15s ease;
    }
    .entry.open .entry-chevron {
      transform: rotate(180deg);
      color: var(--mid);
    }

    /* ── Entry body (hidden until open) ── */
    .entry-body {
      display: none;
      padding: 0 22px 22px;
    }
    .entry.open .entry-body { display: block; }

    /* ── User section ── */
    .user-section {
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--sageL);
    }

    .entry-summary {
      font-size: 14px;
      font-weight: 400;
      color: var(--mid);
      line-height: 1.65;
      margin-bottom: 12px;
    }

    .entry-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .entry-bullets li {
      font-size: 13.5px;
      font-weight: 400;
      color: var(--dark);
      line-height: 1.55;
      padding-left: 16px;
      position: relative;
    }
    .entry-bullets li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--tc);
      opacity: .6;
    }

    /* ── Blog link ── */
    .blog-link-row {
      margin-top: 14px;
    }
    .blog-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--tc);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: opacity .15s ease;
    }
    .blog-link:hover { opacity: .75; }
    .blog-coming-soon {
      font-size: 13px;
      font-style: italic;
      color: var(--lt);
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 400;
    }

    /* ── Builder's note ── */
    .builders-section {
      border-top: 1px solid var(--bdr);
      padding-top: 14px;
      margin-top: 4px;
    }

    .builders-trigger {
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0;
      text-align: left;
      margin-bottom: 0;
    }

    .builders-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mid);
    }

    .builders-chevron {
      color: var(--lt);
      transition: transform .2s ease;
      flex-shrink: 0;
    }
    .builders-section.open .builders-chevron { transform: rotate(180deg); }

    .builders-body {
      display: none;
      padding-top: 14px;
    }
    .builders-section.open .builders-body { display: block; }

    .builders-body p {
      font-size: 13.5px;
      font-weight: 400;
      color: var(--mid);
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .builders-body p:last-child { margin-bottom: 0; }
    .builders-body strong { color: var(--dark); font-weight: 500; }
    .builders-body em { font-style: italic; }
    .builders-body code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      background: var(--cream2);
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--tc);
    }

    /* ── Footer ── */
    .page-footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--bdr);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-brand {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 500;
      font-size: 14px;
      color: var(--tc);
    }
    .footer-note {
      font-size: 12px;
      color: var(--lt);
    }
  </style>
</head>
<body>

<div class="page">

  <header class="page-header">
    <a href="index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to WTF
    </a>

    <div class="wordmark">
      <span class="wordmark-wtf">WTF</span>
      <span class="wordmark-sub">What the Fertility</span>
    </div>

    <h1 class="page-hed">What's new</h1>
    <p class="page-sub">Everything that's shipped, what it means for you, and the decisions behind it.</p>
  </header>

  <div class="divider"></div>

  <div class="entry-list" id="entry-list">
    <!-- Entries injected by JS -->
  </div>

  <footer class="page-footer">
    <span class="footer-brand">WTF</span>
    <span class="footer-note">Built in public by Divya Sriram Patel</span>
  </footer>

</div>

<script type="module" src="./release-notes.js"></script>

</body>
</html>
